apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-university
  labels:
    app: contoso-university
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-university
  template:
    metadata:
      labels:
        app: contoso-university
    spec:
      containers:
      - name: contoso-university
        image: <ACR_LOGIN_SERVER>/contoso-university:latest
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: EnableHttps
          value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: contoso-university-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: contoso-university